# Allow repository/organization variables used in workflows (actionlint has no runtime context)
config-variables:
  - API_DIR_NAME
  - APP_TITLE
  - APP_NAME
  - HTMT_API_APP_NAME
  - DOCKERHUB_USERNAME
  - HTMT_API_IMAGE_REPO
  - DB_VERSION
  - AFP_VERSION
  - ENV
  - STATIC_FILES
  - STATIC_FILES_URL
  - DOMAIN_NAME
  - SERVER_HOST
  - REDEPLOYMENT_HOOK_ID_BASE
  - REDEPLOYMENT_ROOT
  - SYNC_ENV_REMOTE_FILENAME_PREFIX_BASE
  - DEMO_EMAIL
  - SUPERADMIN_EMAIL
  - AFP_ENABLED
  - DB_IMAGE_REPO
  - DB_APP_NAME_SUFFIX
  - AFP_APP_NAME
  - AFP_IMAGE_REPO
  - AFP_VERSION
  - SPOTIFY_CLIENT_ID_STAGING
  - SPOTIFY_CLIENT_ID_PROD
  - SPOTIFY_SCOPES
  - GOOGLE_CLIENT_ID_STAGING
  - GOOGLE_CLIENT_ID_PROD

paths:
  "**/*":
    ignore:
      - "Unexpected value .uses."
      - "Unexpected value .with."
      - "Unexpected value .secrets."
      - "^\\(Line:.*\\): Unexpected value 'uses'$"
      - "^\\(Line:.*\\): Unexpected value 'with'$"
      - "^\\(Line:.*\\): Unexpected value 'secrets'$"
      - "Unexpected value"
      - "Invalid workflow file"
  ".github/workflows/**/*.yml":
    ignore:
      # vars context (repository/org variables) - actionlint has no runtime context
      - 'undefined variable "vars"'
      # secrets: inherit is valid for reusable workflow calls
      - '"secrets" section is scalar node but mapping node is expected'
      # runs-on and environment are required/valid on jobs that call reusable workflows (caller job runs on runner)
      - '"runs-on" is not available'
      - '"environment" is not available'
      # Local workflow calls (./.github/...) and workflow_call nesting are valid
      - 'reusable workflow call ".+" at "uses" is not following the format'
      - 'reusable workflow cannot be nested'
      # Runtime secrets and workflow outputs not in actionlint schema
      - 'property ".+" is not defined in object type'
      # Output from called workflow static-files (declared in workflow_call.outputs)
      - 'collect_static_files_commit_hash'
      - 'Context access might be invalid: collect_static_files_commit_hash'
      - 'property "test_path" is not defined'
      - 'test_path'
      # inputs used in test.yml (optional when called as reusable workflow)
      - 'undefined variable "inputs"'
      - 'property "inputs" is not defined'
      - 'inputs'
      # Job-level uses/with/secrets for reusable workflow calls (valid in GitHub Actions)
      - ".*Unexpected value ['\"]uses['\"].*"
      - ".*Unexpected value ['\"]with['\"].*"
      - ".*Unexpected value ['\"]secrets['\"].*"
  "**/*.yml":
    ignore:
      - ".*Unexpected value ['\"]uses['\"].*"
      - ".*Unexpected value ['\"]with['\"].*"
      - ".*Unexpected value ['\"]secrets['\"].*"
  "**/*.yaml":
    ignore:
      - ".*Unexpected value ['\"]uses['\"].*"
      - ".*Unexpected value ['\"]with['\"].*"
      - ".*Unexpected value ['\"]secrets['\"].*"
  ".github/workflows/**/*.yaml":
    ignore:
      - '"runs-on" is not available'
      - '"environment" is not available'
      - 'undefined variable "vars"'
      - '"secrets" section is scalar node but mapping node is expected'
      - 'reusable workflow call ".+" at "uses" is not following the format'
      - 'reusable workflow cannot be nested'
      - 'property ".+" is not defined in object type'
      - 'collect_static_files_commit_hash'
      - 'Context access might be invalid: collect_static_files_commit_hash'
      - 'property "test_path" is not defined'
      - 'test_path'
      - 'undefined variable "inputs"'
      - 'property "inputs" is not defined'
      - 'inputs'
      - ".*Unexpected value ['\"]uses['\"].*"
      - ".*Unexpected value ['\"]with['\"].*"
      - ".*Unexpected value ['\"]secrets['\"].*"
