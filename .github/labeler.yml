# Auto-labeler configuration for HearTheMusicTree API
# Labels are automatically applied based on file paths changed in PRs

# Component labels - based on main features/modules
track:
  - any:
    - changed-files:
      - any-glob-to-any-file:
        - 'hear/model/track/**'
        - 'hear/serializer/model/track/**'
        - 'hear/view/viewset/model/lib_track/**'
        - 'hear/test/view/track/**'
        - 'hear/utils/audio_metadata/**'
        - 'hear/utils/AudioFile.py'
        - 'hear/validator/TrackFileValidator.py'
        - 'hear/validator/TrackUrlValidator.py'

