name: Branch Protection Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-branch-name:
    name: Verify PR source branch
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch name
        run: |
          SOURCE_BRANCH="${{ github.head_ref }}"
          TARGET_BRANCH="${{ github.base_ref }}"
          # Allowed prefixes for PRs to develop
          VALID_PREFIXES=("feature/" "chore/" "dependabot/" "release/")
          
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            if [[ "$SOURCE_BRANCH" =~ ^hotfix/.* ]] || [[ "$SOURCE_BRANCH" =~ ^release/.* ]]; then
              echo "✅ Valid source branch: $SOURCE_BRANCH"
              echo "PRs to main must come from hotfix/* or release/* branches (Git Flow)"
            else
              echo "❌ Invalid source branch: $SOURCE_BRANCH"
              echo "Pull requests to main must come from hotfix/* or release/* branches only."
              echo ""
              echo "For features, bug fixes, or chores, please target the 'develop' branch instead."
              echo "See CONTRIBUTING.md for Git Flow guidelines."
              exit 1
            fi
          elif [[ "$TARGET_BRANCH" == "develop" ]]; then
            # Allow feature/*, chore/*, dependabot/* and release/* PRs to develop only
            if [[ "$SOURCE_BRANCH" =~ ^feature/.* ]] || \
              [[ "$SOURCE_BRANCH" =~ ^chore/.* ]] || \
              [[ "$SOURCE_BRANCH" =~ ^dependabot/.* ]] || \
              [[ "$SOURCE_BRANCH" =~ ^release/.* ]]; then
              echo "✅ Valid source branch: $SOURCE_BRANCH"
              echo "PRs to develop must come from feature/*, chore/*, dependabot/*, or release/* branches (Git Flow)"
            else
              echo "❌ Invalid source branch: $SOURCE_BRANCH"
              echo "Pull requests to develop must come from feature/*, chore/*, dependabot/*, or release/* branches only."
              echo ""
              echo "Direct PRs from main to develop are not allowed."
              echo "Examples:"
              echo " - feature/improve-genre-classification"
              echo " - chore/update-dependencies"
              echo " - dependabot/pip/requests-2.28.0"
              echo "See CONTRIBUTING.md for Git Flow guidelines."
              exit 1
            fi
          fi



