# Builds the htmt-api image on a GitHub-hosted runner, pushes it to GHCR, then triggers the Coolify
# deploy for the matching environment: develop -> :staging, main -> :prod (plus :sha-<short> always).
# Offloads image builds from the VPS; Coolify deploys the moving :staging / :prod tag.
# Requires repo vars APP_TITLE, API_DIR_NAME (Dockerfile build args), org-level vars
# COOLIFY_API_SUBDOMAIN, DOMAIN_NAME, SERVER_HOST and org-level secret COOLIFY_API_TOKEN.
name: Build and deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Serializes build+deploy per branch so an older run can't overwrite a newer :staging/:prod tag.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/behindthemusictree/htmt-api

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5.0.1

      - name: Check required vars
        env:
          APP_TITLE: ${{ vars.APP_TITLE }}
          API_DIR_NAME: ${{ vars.API_DIR_NAME }}
        run: bash scripts/check-workflow-env.sh APP_TITLE API_DIR_NAME

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: |
            APP_TITLE=${{ vars.APP_TITLE }}
            API_DIR_NAME=${{ vars.API_DIR_NAME }}
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy htmt-api (staging)
    if: github.ref == 'refs/heads/develop'
    needs: [build]
    runs-on: ubuntu-latest
    environment: STAGING
    steps:
      - name: Trigger htmt-api deploy
        uses: BehindTheMusicTree/github-workflows/.github/actions/trigger-coolify-deploy@v4.4.0
        with:
          app_name: htmt-api
          coolify_environment: staging
          coolify_subdomain: ${{ vars.COOLIFY_API_SUBDOMAIN }}
          domain: ${{ vars.DOMAIN_NAME }}
          coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
          server_host: ${{ vars.SERVER_HOST }}
          server_deploy_username: ${{ secrets.SERVER_DEPLOY_USERNAME }}
          server_deploy_ssh_private_key: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL_STATUS_ALERTS }}
          health_check_path: /health/
          health_check_origin_ip: ${{ vars.SERVER_HOST }}

  deploy-prod:
    name: Deploy htmt-api (prod)
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Trigger htmt-api deploy
        uses: BehindTheMusicTree/github-workflows/.github/actions/trigger-coolify-deploy@v4.4.0
        with:
          app_name: htmt-api
          coolify_environment: production
          coolify_subdomain: ${{ vars.COOLIFY_API_SUBDOMAIN }}
          domain: ${{ vars.DOMAIN_NAME }}
          coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
          server_host: ${{ vars.SERVER_HOST }}
          server_deploy_username: ${{ secrets.SERVER_DEPLOY_USERNAME }}
          server_deploy_ssh_private_key: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
          discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL_STATUS_ALERTS_PROD }}
          health_check_path: /health/
          health_check_origin_ip: ${{ vars.SERVER_HOST }}
