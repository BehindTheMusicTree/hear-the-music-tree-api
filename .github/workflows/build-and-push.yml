name: Build

on:
  workflow_call:
    inputs:
      commit_hash:
        description: 'Commit hash to build from (optional)'
        required: false
        type: string
      app_version:
        description: 'App version (build-arg APP_VERSION for display in container)'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag to push (e.g. 1.2.3 for release, staging for staging)'
        required: true
        type: string
      environment:
        description: 'Deployment environment (TEST or PROD) for secrets/vars'
        required: false
        type: string
        default: TEST

permissions:
  contents: read
  packages: write

env:
  DB_CONNECTION_TEST_MAX_ATTEMPTS: 10
  DB_CONNECTION_TEST_SLEEP_INTERVAL: 5

jobs:
  build-and-push-to-ghcr:
    name: Push to GHCR
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'TEST' }}
    env:
      APP_VERSION: ${{ inputs.app_version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      APP_TITLE: ${{ vars.APP_TITLE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_hash || github.sha }}

      - name: Check required vars and secrets
        env:
          API_DIR_NAME: ${{ vars.API_DIR_NAME }}
          GHCR_IMAGE_NAMESPACE: ${{ vars.GHCR_IMAGE_NAMESPACE }}
          HTMT_API_IMAGE_REPO: ${{ vars.HTMT_API_IMAGE_REPO }}
          STATIC_FILES_URL: ${{ vars.STATIC_FILES_URL }}
          APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
        run: bash scripts/check-workflow-env.sh API_DIR_NAME GHCR_IMAGE_NAMESPACE HTMT_API_IMAGE_REPO STATIC_FILES_URL APP_NAME APP_TITLE

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        env:
          IMAGE_FULL_NAME: ghcr.io/${{ vars.GHCR_IMAGE_NAMESPACE }}/${{ vars.HTMT_API_IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_FULL_NAME }}
          build-args: |
            APP_VERSION=${{ inputs.app_version }}
            APP_TITLE=${{ env.APP_TITLE }}
            API_DIR_NAME=${{ vars.API_DIR_NAME }}
            STATIC_FILES_URL=${{ vars.STATIC_FILES_URL }}
            APP_NAME=${{ vars.HTMT_API_APP_NAME }}
