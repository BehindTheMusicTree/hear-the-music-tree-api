name: Build

on:
  workflow_call:
    inputs:
      commit_hash:
        description: 'Commit hash to build from (optional)'
        required: false
        type: string
      app_version:
        description: 'App version (build-arg APP_VERSION for display in container)'
        required: true
        type: string
      image_tag:
        description: 'Docker image tag to push (e.g. 1.2.3 for release, staging for staging)'
        required: true
        type: string
      environment:
        description: 'Deployment environment (TEST or PROD) for secrets/vars'
        required: false
        type: string
        default: TEST

env:
  DB_CONNECTION_TEST_MAX_ATTEMPTS: 10
  DB_CONNECTION_TEST_SLEEP_INTERVAL: 5
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  build-and-push-to-dockerhub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'TEST' }}
    env:
      APP_VERSION: ${{ inputs.app_version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      APP_TITLE: ${{ vars.APP_TITLE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_hash || github.sha }}

      - name: Check required vars and secrets
        env:
          API_DIR_NAME: ${{ vars.API_DIR_NAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HTMT_API_IMAGE_REPO: ${{ vars.HTMT_API_IMAGE_REPO }}
          STATIC_FILES_INTERNAL: ${{ vars.STATIC_FILES_INTERNAL }}
          STATIC_FILES_URL: ${{ vars.STATIC_FILES_URL }}
          APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: bash scripts/check-workflow-env.sh API_DIR_NAME DOCKERHUB_USERNAME HTMT_API_IMAGE_REPO STATIC_FILES_INTERNAL STATIC_FILES_URL APP_NAME DOCKERHUB_ACCESS_TOKEN APP_TITLE

      - name: Login to Dockerhub
        run: |
          echo "${{ secrets.DOCKERHUB_ACCESS_TOKEN }}" | \
          docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker image
        env:
          IMAGE_FULL_NAME: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.HTMT_API_IMAGE_REPO }}:${{ env.IMAGE_TAG }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_FULL_NAME }}
          build-args: |
            APP_VERSION=${{ inputs.app_version }}
            APP_TITLE=${{ env.APP_TITLE }}
            API_DIR_NAME=${{ vars.API_DIR_NAME }}
            STATIC_FILES_INTERNAL=${{ vars.STATIC_FILES_INTERNAL }}
            STATIC_FILES_URL=${{ vars.STATIC_FILES_URL }}
            APP_NAME=${{ vars.HTMT_API_APP_NAME }}