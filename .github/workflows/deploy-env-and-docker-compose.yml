# Reference caller workflow for an app repo (e.g. htmt-api): prepare env vars and partial
# docker-compose, then call the three reusable workflows (nginx env, app env, docker compose).
# The reusables live in the public repo BehindTheMusicTree/github-workflows; copy only this
# caller to your app repo's .github/workflows/ (reusables are called from that repo).
#
# Pool: $WEBHOOK_DIR + $WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE + "-" + env + "/pool". Subdirs:
#   pool/nginx/<app>.env — merged into nginx .env by redeploy.
#   pool/compose/<app_name>/ — compose env files; redeploy copies to compose dir.
name: Deploy Env variables And Partial Docker Compose

on:
  workflow_call:
    inputs:
      app_version:
        description: 'App version to use'
        required: true
        type: string
      env:
        description: 'Environment to deploy to (test or prod, lowercase to match server paths)'
        required: true
        type: string

env:
  SSH_DESTINATION: ${{ secrets.SERVER_DEPLOY_USERNAME }}@${{ vars.DOMAIN_NAME }}
  CONTAINER_ROOT_DIR: /home/api/
  DOCKERIZED_APP_ENV_FILENAME: .env_api

jobs:
  prepare:
    name: Prepare artifacts
    runs-on: ubuntu-latest
    environment:
      name: TEST
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required vars and secrets
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          WEBHOOK_DIR: ${{ vars.WEBHOOK_DIR }}
          WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE: ${{ vars.WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE }}
          DOCKER_COMPOSE_DIR_NAME: ${{ vars.DOCKER_COMPOSE_DIR_NAME }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          API_PORT: ${{ vars.HTMT_API_PORT }}
          CSRF_TRUSTED_ORIGINS: ${{ vars.CSRF_TRUSTED_ORIGINS }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          DOCKER_COMPOSE_PARTIAL_FILENAME_SUFFIXE: ${{ vars.DOCKER_COMPOSE_PARTIAL_FILENAME_SUFFIXE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_SUPERUSER_NAME: ${{ vars.DB_SUPERUSER_NAME }}
          DB_ENV_FILENAME: ${{ vars.DB_ENV_FILENAME }}
          DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
          DB_VERSION: ${{ vars.DB_VERSION }}
          DB_DATA_DIR: ${{ vars.DB_DATA_DIR }}
          DB_PORT_HOST: ${{ vars.DB_PORT_HOST }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          DB_BODZIFY_API_DB_NAME: ${{ secrets.DB_BODZIFY_API_DB_NAME }}
          DB_BODZIFY_API_USERNAME: ${{ secrets.DB_BODZIFY_API_USERNAME }}
          DB_BODZIFY_API_USER_PASSWORD: ${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}
          AFP_CONTAINER_NAME: ${{ vars.AFP_CONTAINER_NAME }}
          AFP_PORT: ${{ vars.AFP_PORT }}
          AFP_POST_ENDPOINT: ${{ vars.AFP_POST_ENDPOINT }}
          AFP_ENV_FILENAME: ${{ vars.AFP_ENV_FILENAME }}
          AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
          AFP_VERSION: ${{ vars.AFP_VERSION }}
          AFP_POOL_DIR_EXTERNAL: ${{ vars.AFP_POOL_DIR_EXTERNAL }}
          AFP_FLASK_LOG_DIR_EXTERNAL: ${{ vars.AFP_FLASK_LOG_DIR_EXTERNAL }}
          AFP_GUNICORN_LOG_DIR_EXTERNAL: ${{ vars.AFP_GUNICORN_LOG_DIR_EXTERNAL }}
          API_SERVICE_NAME: ${{ vars.HTMT_API_SERVICE_NAME }}
          APP_IMAGE_REPO: ${{ vars.APP_IMAGE_REPO }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME }}
          GUNICORN_LOG_DIR: ${{ vars.GUNICORN_LOG_DIR }}
          GUNICORN_LOG_ERROR_FILENAME: ${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
          GUNICORN_LOG_ACCESS_FILENAME: ${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
          DJANGO_LOG_DIR_EXTERNAL: ${{ vars.DJANGO_LOG_DIR_EXTERNAL }}
          MEDIA_DIR_EXTERNAL: ${{ vars.MEDIA_DIR_EXTERNAL }}
          STATIC_FILES_EXTERNAL: ${{ vars.STATIC_FILES_EXTERNAL }}
          TMP_UPLOADED_FILES_EXTERNAL: ${{ vars.TMP_UPLOADED_FILES_EXTERNAL }}
          SERVER_DEPLOY_USERNAME: ${{ secrets.SERVER_DEPLOY_USERNAME }}
          SERVER_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID_PROD }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET_PROD }}
          SPOTIFY_SCOPES: ${{ secrets.SPOTIFY_SCOPES }}
          SPOTIFY_REDIRECT_RELATIVE_URI: ${{ vars.SPOTIFY_REDIRECT_RELATIVE_URI }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_PROD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_PROD }}
          GOOGLE_REDIRECT_RELATIVE_URI: ${{ vars.GOOGLE_REDIRECT_RELATIVE_URI }}
          TMTA_USERNAME: ${{ secrets.TMTA_USERNAME }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          HTMT_API_CONTAINER_MEDIA_DIR: ${{ vars.MEDIA_DIR_EXTERNAL }}
          HTMT_API_STATIC_FILES: ${{ vars.STATIC_FILES_EXTERNAL }}
        run: |
          bash scripts/check-workflow-env.sh \
            APP_NAME \
            DOMAIN_NAME \
            WEBHOOK_DIR \
            WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE \
            DOCKER_COMPOSE_DIR_NAME \
            API_PORT \
            CSRF_TRUSTED_ORIGINS \
            ALLOWED_HOSTS \
            DOCKER_COMPOSE_PARTIAL_FILENAME_SUFFIXE \
            DOCKERHUB_USERNAME \
            DB_CONTAINER_NAME \
            DB_PORT \
            DB_SUPERUSER_NAME \
            DB_ENV_FILENAME \
            DB_IMAGE_REPO \
            DB_VERSION \
            DB_DATA_DIR \
            DB_PORT_HOST \
            DB_SUPERUSER_PASSWORD \
            DB_BODZIFY_API_DB_NAME \
            DB_BODZIFY_API_USERNAME \
            DB_BODZIFY_API_USER_PASSWORD \
            AFP_CONTAINER_NAME \
            AFP_PORT \
            AFP_POST_ENDPOINT \
            AFP_ENV_FILENAME \
            AFP_IMAGE_REPO \
            AFP_VERSION \
            AFP_POOL_DIR_EXTERNAL \
            AFP_FLASK_LOG_DIR_EXTERNAL \
            AFP_GUNICORN_LOG_DIR_EXTERNAL \
            API_SERVICE_NAME \
            APP_IMAGE_REPO \
            APP_CONTAINER_NAME \
            GUNICORN_LOG_DIR \
            GUNICORN_LOG_ERROR_FILENAME \
            GUNICORN_LOG_ACCESS_FILENAME \
            DJANGO_LOG_DIR_EXTERNAL \
            MEDIA_DIR_EXTERNAL \
            STATIC_FILES_EXTERNAL \
            TMP_UPLOADED_FILES_EXTERNAL \
            SERVER_DEPLOY_USERNAME \
            SERVER_DEPLOY_SSH_PRIVATE_KEY \
            DJANGO_SECRET_KEY \
            ACOUSTID_API_KEY \
            SPOTIFY_CLIENT_ID \
            SPOTIFY_CLIENT_SECRET \
            SPOTIFY_REDIRECT_RELATIVE_URI \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            TMTA_USERNAME \
            SUPERADMIN_USERNAME \
            SUPERADMIN_EMAIL \
            SUPERADMIN_PASSWORD \
            DEMO_USERNAME \
            DEMO_EMAIL \
            DEMO_PASSWORD \
            HTMT_API_CONTAINER_MEDIA_DIR \
            HTMT_API_STATIC_FILES

      - name: Build nginx env fragment
        run: |
          mkdir -p nginx_fragment
          {
            echo "HTMT_API_CONTAINER_MEDIA_DIR=${{ vars.MEDIA_DIR_EXTERNAL }}"
            echo "HTMT_API_STATIC_FILES=${{ vars.STATIC_FILES_EXTERNAL }}"
          } > nginx_fragment/fragment.env

      - name: Upload nginx-env-fragment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-env-fragment
          path: nginx_fragment/

      - name: Build API env file
        run: |
          mkdir -p pool_compose_api
          {
            echo 'ENV=${{ inputs.env }}'
            echo 'APP_NAME=${{ vars.APP_NAME }}'
            echo 'APP_PORT=${{ vars.HTMT_API_PORT }}'
            echo 'DEBUG=true'
            echo 'APP_IS_EXPOSED=true'
            echo "DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}'"
            echo "ACOUSTID_API_KEY='${{ secrets.ACOUSTID_API_KEY }}'"
            echo "SPOTIFY_CLIENT_ID='${{ secrets.SPOTIFY_CLIENT_ID_PROD }}'"
            echo "SPOTIFY_CLIENT_SECRET='${{ secrets.SPOTIFY_CLIENT_SECRET_PROD }}'"
            echo "SPOTIFY_REDIRECT_URI='https://${{ vars.GTMT_FRONT_SUBDOMAIN_NAME }}.${{ vars.DOMAIN_NAME }}/${{ vars.SPOTIFY_REDIRECT_RELATIVE_URI }}'"
            echo "SPOTIFY_SCOPES='${{ vars.SPOTIFY_SCOPES }}'"
            echo "GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID_PROD }}'"
            echo "GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET_PROD }}'"
            echo "GOOGLE_REDIRECT_URI='https://${{ vars.GTMT_FRONT_SUBDOMAIN_NAME }}.${{ vars.DOMAIN_NAME }}/${{ vars.GOOGLE_REDIRECT_RELATIVE_URI }}'"
            echo 'CSRF_TRUSTED_ORIGINS=${{ vars.CSRF_TRUSTED_ORIGINS }}'
            echo 'ALLOWED_HOSTS=${{ vars.ALLOWED_HOSTS }}'
            echo 'TMP_UPLOADED_FILES=${{ vars.TMP_UPLOADED_FILES_EXTERNAL }}'
            echo 'MEDIA_URL=${{ vars.HTMT_API_MEDIA_URL }}'
            echo 'MEDIA_DIR_EXTERNAL=${{ vars.MEDIA_DIR_EXTERNAL }}'
            echo 'LIBRARIES_DIR_NAME=${{ vars.LIBRARIES_DIR_NAME }}'
            echo 'GUNICORN_LOG_DIR=${{ vars.GUNICORN_LOG_DIR }}'
            echo 'GUNICORN_LOG_ACCESS_FILENAME=${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}'
            echo 'GUNICORN_LOG_ERROR_FILENAME=${{ vars.GUNICORN_LOG_ERROR_FILENAME }}'
            echo 'DB_CONTAINER_NAME=${{ vars.DB_CONTAINER_NAME }}'
            echo 'DB_PORT=${{ vars.DB_PORT }}'
            echo 'DB_CONNECTION_TEST_MAX_ATTEMPTS=10'
            echo 'DB_CONNECTION_TEST_SLEEP_INTERVAL=5'
            echo 'DB_SUPERUSER_NAME=${{ vars.DB_SUPERUSER_NAME }}'
            echo "DB_SUPERUSER_PASSWORD='${{ secrets.DB_SUPERUSER_PASSWORD }}'"
            echo 'DB_BODZIFY_API_DB_NAME=${{ secrets.DB_BODZIFY_API_DB_NAME }}'
            echo 'DB_BODZIFY_API_USERNAME=${{ secrets.DB_BODZIFY_API_USERNAME }}'
            echo "DB_BODZIFY_API_USER_PASSWORD='${{ secrets.DB_BODZIFY_API_USER_PASSWORD }}'"
            echo 'AFP_CONTAINER_NAME=${{ vars.AFP_CONTAINER_NAME }}'
            echo 'AFP_PORT=${{ vars.AFP_PORT }}'
            echo 'AFP_POST_ENDPOINT=${{ vars.AFP_POST_ENDPOINT }}'
            echo 'TMTA_USERNAME=${{ secrets.TMTA_USERNAME }}'
            echo 'SUPERADMIN_USERNAME=${{ secrets.SUPERADMIN_USERNAME }}'
            echo 'SUPERADMIN_EMAIL=${{ vars.SUPERADMIN_EMAIL }}'
            echo "SUPERADMIN_PASSWORD='${{ secrets.SUPERADMIN_PASSWORD }}'"
            echo 'DEMO_USERNAME=${{ secrets.DEMO_USERNAME }}'
            echo 'DEMO_EMAIL=${{ vars.DEMO_EMAIL }}'
            echo "DEMO_PASSWORD='${{ secrets.DEMO_PASSWORD }}'"
          } > pool_compose_api/.env_api

      - name: Build DB env file
        run: |
          mkdir -p pool_compose_db
          {
            echo 'ENV=${{ inputs.env }}'
            echo 'POSTGRES_DB=${{ secrets.DB_BODZIFY_API_DB_NAME }}'
            echo 'POSTGRES_USER=${{ vars.DB_SUPERUSER_NAME }}'
            echo "POSTGRES_PASSWORD=${{ secrets.DB_SUPERUSER_PASSWORD }}"
            echo 'POSTGRES_PORT=${{ vars.DB_PORT }}'
          } > pool_compose_db/.env_db

      - name: Build AFP env file
        run: |
          mkdir -p pool_compose_afp
          {
            echo 'ENV=${{ inputs.env }}'
            echo 'DEBUG=true'
            echo 'APP_PORT=${{ vars.AFP_PORT }}'
          } > pool_compose_afp/.env_afp

      - name: Upload app-env-api artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-env-api
          path: pool_compose_api/

      - name: Upload app-env-db artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-env-db
          path: pool_compose_db/

      - name: Upload app-env-afp artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-env-afp
          path: pool_compose_afp/

      - name: Generate partial docker compose files
        env:
          DOCKER_COMPOSE_PARTIAL_FILENAME_SUFFIXE: ${{ vars.DOCKER_COMPOSE_PARTIAL_FILENAME_SUFFIXE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
          AFP_VERSION: ${{ vars.AFP_VERSION }}
          AFP_CONTAINER_NAME: ${{ vars.AFP_CONTAINER_NAME }}
          AFP_PORT: ${{ vars.AFP_PORT }}
          AFP_ENV_FILENAME: ${{ vars.AFP_ENV_FILENAME }}
          AFP_POOL_DIR_EXTERNAL: ${{ vars.AFP_POOL_DIR_EXTERNAL }}
          AFP_FLASK_LOG_DIR_EXTERNAL: ${{ vars.AFP_FLASK_LOG_DIR_EXTERNAL }}
          AFP_GUNICORN_LOG_DIR_EXTERNAL: ${{ vars.AFP_GUNICORN_LOG_DIR_EXTERNAL }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_ROOT_DIR: ${{ env.CONTAINER_ROOT_DIR }}
          APP_SERVICE_NAME: ${{ vars.HTMT_API_SERVICE_NAME }}
          APP_IMAGE_REPO: ${{ vars.APP_IMAGE_REPO }}
          APP_CONTAINER_NAME: ${{ vars.APP_CONTAINER_NAME }}
          APP_PORT: ${{ vars.HTMT_API_PORT }}
          APP_ENV_FILENAME: ${{ env.DOCKERIZED_APP_ENV_FILENAME }}
          GUNICORN_LOG_DIR: ${{ vars.GUNICORN_LOG_DIR }}
          GUNICORN_LOG_ERROR_FILENAME: ${{ vars.GUNICORN_LOG_ERROR_FILENAME }}
          GUNICORN_LOG_ACCESS_FILENAME: ${{ vars.GUNICORN_LOG_ACCESS_FILENAME }}
          DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
          DB_VERSION: ${{ vars.DB_VERSION }}
          DB_CONTAINER_NAME: ${{ vars.DB_CONTAINER_NAME }}
          DB_DATA_DIR: ${{ vars.DB_DATA_DIR }}
          DB_PORT_HOST: ${{ vars.DB_PORT_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_ENV_FILENAME: ${{ vars.DB_ENV_FILENAME }}
          DJANGO_LOG_DIR_EXTERNAL: ${{ vars.DJANGO_LOG_DIR_EXTERNAL }}
          MEDIA_DIR_EXTERNAL: ${{ vars.MEDIA_DIR_EXTERNAL }}
          STATIC_FILES_EXTERNAL: ${{ vars.STATIC_FILES_EXTERNAL }}
          TMP_UPLOADED_FILES_EXTERNAL: ${{ vars.TMP_UPLOADED_FILES_EXTERNAL }}
        run: |
          bash scripts/generate-docker-compose-parts.sh

      - name: Prepare compose-parts
        run: |
          mkdir -p compose_parts
          cp scripts/*${{ vars.DOCKER_COMPOSE_PARTIAL_FILENAME_SUFFIXE }} compose_parts/

      - name: Upload compose-parts artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-parts
          path: compose_parts/

  deploy-nginx-env:
    name: Deploy nginx env fragment
    needs: [prepare]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/deploy-nginx-env-fragment.yml@main
    with:
      env: ${{ inputs.env }}
      app_name: ${{ vars.APP_NAME }}
    secrets: inherit

  deploy-app-env-api:
    name: Deploy API env file
    needs: [prepare]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/deploy-app-env-file.yml@main
    with:
      env: ${{ inputs.env }}
      app_name: ${{ vars.APP_NAME }}
      artifact_name: app-env-api
    secrets: inherit

  deploy-app-env-db:
    name: Deploy DB env file
    needs: [prepare]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/deploy-app-env-file.yml@main
    with:
      env: ${{ inputs.env }}
      app_name: ${{ vars.APP_NAME }}
      artifact_name: app-env-db
    secrets: inherit

  deploy-app-env-afp:
    name: Deploy AFP env file
    needs: [prepare]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/deploy-app-env-file.yml@main
    with:
      env: ${{ inputs.env }}
      app_name: ${{ vars.APP_NAME }}
      artifact_name: app-env-afp
    secrets: inherit

  deploy-compose:
    name: Deploy partial docker compose
    needs: [prepare]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/deploy-partial-docker-compose.yml@main
    with:
      env: ${{ inputs.env }}
      app_version: ${{ inputs.app_version }}
    secrets: inherit
