# yaml-language-server: disable
# Build and push HTMT API image tagged as :staging (industry standard: moving tag for deploy).
# App version inside container is VERSION-staging (e.g. 2.1.1-staging) for traceability.
# Trigger: push to develop or workflow_dispatch. Before calling the redeploy webhook, this workflow
# writes the image tag to the server (set-image-tag-on-server) so redeploy pulls :staging for test env.
name: Publish staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      env: ${{ steps.version.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set staging version and tag
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "Error: VERSION file is empty or missing."
            exit 1
          fi
          {
            echo "app_version=${VERSION}-staging"
            echo "image_tag=staging"
            echo "env=test"
          } >> "$GITHUB_OUTPUT"
          echo "Staging: app_version=${VERSION}-staging, image_tag=staging"

  static:
    name: Static files
    needs: [determine-version]
    uses: ./.github/workflows/static-files.yml
    with:
      app_version: ${{ needs.determine-version.outputs.app_version }}
    secrets: inherit

  build-and-push:
    name: Docker image
    needs: [static, determine-version]
    uses: ./.github/workflows/build-and-push.yml
    with:
      commit_hash: ${{ needs.static.outputs.collect_static_files_commit_hash }}
      app_version: ${{ needs.determine-version.outputs.app_version }}
      image_tag: ${{ needs.determine-version.outputs.image_tag }}
    secrets: inherit

  check-pinned-tags:
    name: Check DB/AFP tags are pinned
    runs-on: ubuntu-latest
    needs: [determine-version]
    environment: TEST
    env:
      DB_VERSION: ${{ vars.DB_VERSION }}
      AFP_VERSION: ${{ vars.AFP_VERSION }}
    steps:
      - name: Require pinned DB and AFP image tags
        run: |
          missing=""
          [ -z "${DB_VERSION}" ] && missing="${missing} DB_VERSION"
          [ -z "${AFP_VERSION}" ] && missing="${missing} AFP_VERSION"
          if [ -n "$missing" ]; then
            echo "ERROR: Pinned image tags required (no 'latest'). Set in Settings → Variables:$missing"
            echo "Example: DB_VERSION=16, AFP_VERSION=1.0"
            exit 1
          fi
          echo "DB_VERSION=$DB_VERSION, AFP_VERSION=$AFP_VERSION"

  set-version-api:
    name: Set API version on server
    needs: [build-and-push, determine-version]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ needs.determine-version.outputs.image_tag }}
      app_name: htmt-api
    secrets: inherit

  set-version-db:
    name: Set DB version on server
    needs: [determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ vars.DB_VERSION }}
      app_name: htmt-db
    secrets: inherit

  set-version-afp:
    name: Set AFP version on server
    needs: [determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ vars.AFP_VERSION }}
      app_name: afp
    secrets: inherit

  redeploy-webhook-call:
    name: Redeploy webhook
    needs: [build-and-push, set-version-api, set-version-db, set-version-afp, check-pinned-tags, determine-version]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/call-redeployment-webhook.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
    secrets: inherit
