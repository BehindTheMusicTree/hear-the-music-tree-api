# Release: build image with version tag, set that tag on server (set-image-tag-on-server), then trigger redeploy webhook.
name: Publish

on:
  workflow_call:
  push:
    tags:
      - 'v*'

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}
      env: ${{ steps.version.outputs.env }}
    steps:
      - name: Checkout code
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using version from tag ref: $VERSION"
          else
            git fetch --tags --force
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              echo "Error: Cannot determine version. No tag provided."
              exit 1
            fi
            VERSION="${LATEST_TAG#v}"
            echo "Using latest tag version: $VERSION (from tag: $LATEST_TAG)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "env=test" >> "$GITHUB_OUTPUT"
            echo "Prerelease version -> env test"
          else
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "Release version -> env prod"
          fi

  static:
    name: Static files
    needs: [determine-version]
    uses: ./.github/workflows/static-files.yml
    with:
      app_version: ${{ needs.determine-version.outputs.app_version }}
    secrets: inherit

  build-and-push:
    name: Docker image
    needs: [static, determine-version]
    uses: ./.github/workflows/build-and-push.yml
    with:
      commit_hash: ${{ needs.static.outputs.collect_static_files_commit_hash }}
      app_version: ${{ needs.determine-version.outputs.app_version }}
      image_tag: ${{ needs.determine-version.outputs.app_version }}
    secrets: inherit

  check-pinned-tags:
    name: Check DB/AFP tags are pinned
    runs-on: ubuntu-latest
    needs: [determine-version]
    env:
      DB_VERSION: ${{ vars.DB_VERSION }}
      AFP_VERSION: ${{ vars.AFP_VERSION }}
    steps:
      - name: Require pinned DB and AFP image tags
        run: |
          missing=""
          [ -z "${DB_VERSION}" ] && missing="${missing} DB_VERSION"
          [ -z "${AFP_VERSION}" ] && missing="${missing} AFP_VERSION"
          if [ -n "$missing" ]; then
            echo "ERROR: Pinned image tags required (no 'latest'). Set in Settings → Variables:$missing"
            echo "Example: DB_VERSION=16, AFP_VERSION=1.0"
            exit 1
          fi
          echo "DB_VERSION=$DB_VERSION, AFP_VERSION=$AFP_VERSION"

  set-version-api:
    name: Set API version on server
    needs: [build-and-push, determine-version]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ needs.determine-version.outputs.app_version }}
      app_name: htmt-api
    secrets: inherit

  set-version-db:
    name: Set DB version on server
    needs: [determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ vars.DB_VERSION }}
      app_name: htmt-db
    secrets: inherit

  set-version-afp:
    name: Set AFP version on server
    needs: [determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ vars.AFP_VERSION }}
      app_name: afp
    secrets: inherit

  redeploy-webhook-call:
    name: Redeploy webhook
    needs: [build-and-push, set-version-api, set-version-db, set-version-afp, check-pinned-tags, determine-version]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/call-redeployment-webhook.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
    secrets: inherit

