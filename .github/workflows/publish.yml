name: Publish

on:
  workflow_call:
  push:
    tags:
      - 'v*'

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract from tag ref (e.g., refs/tags/v0.3.4 -> 0.3.4)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Using version from tag ref: $VERSION"
          else
            # Fallback: fetch tags and get the latest one
            git fetch --tags --force
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              echo "Error: Cannot determine version. No tag provided."
              exit 1
            fi
            # Remove 'v' prefix if present
            VERSION="${LATEST_TAG#v}"
            echo "Using latest tag version: $VERSION (from tag: $LATEST_TAG)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  static:
    name: Static files
    needs: [determine-version]
    uses: ./.github/workflows/static-files.yml
    with:
      app_version: ${{ needs.determine-version.outputs.app_version }}
    secrets: inherit

  build-and-push:
    name: Docker image
    needs: [static, determine-version]
    uses: ./.github/workflows/build-and-push.yml
    with:
      commit_hash: ${{ needs.static.outputs.collect_static_files_commit_hash }}
      app_version: ${{ needs.determine-version.outputs.app_version }}
    secrets: inherit

  deploy-env-and-docker-compose:
    name: Deploy
    needs: [determine-version]
    uses: ./.github/workflows/deploy-env-and-docker-compose.yml
    with:
      app_version: ${{ needs.determine-version.outputs.app_version }}
    secrets: inherit

  redeploy-webhook-call:
    name: Redeploy webhook
    needs: [build-and-push, deploy-env-and-docker-compose]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/call-redeployment-webhook.yml@main
    with:
      env: TEST
    secrets: inherit

