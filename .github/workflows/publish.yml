# yaml-language-server: $schema=https://gist.githubusercontent.com/sargunv/c2ca41a08391cd06feaad97aece309e4/raw/empty-json-schema.json
# Single publish: main push or prerelease/dev tag → TEST + staging; release tag → PROD + production.
name: Publish

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  determine-version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      env: ${{ steps.version.outputs.env }}
      deployment_environment: ${{ steps.version.outputs.deployment_environment }}
    steps:
      - name: Checkout code
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Checkout for main branch
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Set version and environment
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [[ "$VERSION" == *-* ]]; then
              {
                echo "app_version=$VERSION"
                echo "image_tag=$VERSION"
                echo "env=staging"
                echo "deployment_environment=STAGING"
              } >> "$GITHUB_OUTPUT"
              echo "Prerelease/dev tag -> STAGING, staging"
            else
              {
                echo "app_version=$VERSION"
                echo "image_tag=$VERSION"
                echo "env=prod"
                echo "deployment_environment=PROD"
              } >> "$GITHUB_OUTPUT"
              echo "Release tag -> PROD, production"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION=$(tr -d '[:space:]' < VERSION)
            if [ -z "$VERSION" ]; then
              echo "Error: VERSION file is empty or missing."
              exit 1
            fi
            {
              echo "app_version=${VERSION}-staging"
              echo "image_tag=staging"
              echo "env=staging"
              echo "deployment_environment=STAGING"
            } >> "$GITHUB_OUTPUT"
            echo "Main push -> STAGING, staging"
          else
            echo "Error: Unsupported ref '$GITHUB_REF'."
            echo "Only 'main' branch or tags matching 'v*' are supported."
            exit 1
          fi

  build-and-push:
    name: Docker image
    needs: [determine-version]
    uses: ./.github/workflows/build-and-push.yml
    with:
      app_version: ${{ needs.determine-version.outputs.app_version }}
      image_tag: ${{ needs.determine-version.outputs.image_tag }}
      environment: ${{ needs.determine-version.outputs.deployment_environment }}
    secrets: inherit

  check-pinned-tags:
    name: Check AFP tag is pinned
    runs-on: ubuntu-latest
    needs: [determine-version]
    environment: ${{ needs.determine-version.outputs.deployment_environment }}
    env:
      AFP_VERSION: ${{ vars.AFP_VERSION }}
      REDEPLOYMENT_ROOT: ${{ vars.REDEPLOYMENT_ROOT }}
      HTMT_API_APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
      DB_APP_NAME_SUFFIX: ${{ vars.DB_APP_NAME_SUFFIX }}
      AFP_APP_NAME: ${{ vars.AFP_APP_NAME }}
    outputs:
      afp_version: ${{ steps.pinned.outputs.afp_version }}
    steps:
      - name: Require deploy and app-name vars (set-image-tag-on-server)
        run: |
          missing=""
          [ -z "${REDEPLOYMENT_ROOT}" ] && missing="${missing} REDEPLOYMENT_ROOT"
          [ -z "${HTMT_API_APP_NAME}" ] && missing="${missing} HTMT_API_APP_NAME"
          [ -z "${DB_APP_NAME_SUFFIX}" ] && missing="${missing} DB_APP_NAME_SUFFIX"
          [ -z "${AFP_APP_NAME}" ] && missing="${missing} AFP_APP_NAME"
          if [ -n "$missing" ]; then
            echo "ERROR: Set org-level (or this repo) Variables:$missing"
            echo "Example: REDEPLOYMENT_ROOT=/var/webhook/redeployment, HTMT_API_APP_NAME=htmt-api, DB_APP_NAME_SUFFIX=-db, AFP_APP_NAME=afp (must match infrastructure)"
            exit 1
          fi
      - name: Require pinned AFP image tag
        id: pinned
        run: |
          missing=""
          [ -z "${AFP_VERSION}" ] && missing="${missing} AFP_VERSION"
          if [ -n "$missing" ]; then
            echo "ERROR: Pinned AFP image tag required (no 'latest'). Set AFP_VERSION in Settings → Variables."
            echo "Example: AFP_VERSION=v1.4.4"
            exit 1
          fi
          echo "AFP_VERSION=$AFP_VERSION (DB image is fixed to postgres:16.4 in docker-compose.yml)"
          echo "afp_version=$AFP_VERSION" >> "$GITHUB_OUTPUT"

  set-version-api:
    name: Set API version on server
    needs: [build-and-push, determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ needs.determine-version.outputs.image_tag }}
      app_name: ${{ vars.HTMT_API_APP_NAME }}
    secrets: inherit

  set-version-db:
    name: Set DB version on server
    needs: [determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: '16.4'
      app_name: ${{ format('{0}{1}', vars.HTMT_API_APP_NAME, vars.DB_APP_NAME_SUFFIX) }}
    secrets: inherit

  set-version-afp:
    name: Set AFP version on server
    needs: [determine-version, check-pinned-tags]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/set-image-tag-on-server.yml@main
    with:
      env: ${{ needs.determine-version.outputs.env }}
      tag: ${{ needs.check-pinned-tags.outputs.afp_version }}
      app_name: ${{ vars.AFP_APP_NAME }}
    secrets: inherit

  redeploy-webhook-call:
    name: Redeploy webhook
    needs: [build-and-push, set-version-api, set-version-db, set-version-afp, check-pinned-tags, determine-version]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/call-redeployment-webhook.yml@v0.3.0
    with:
      env: ${{ needs.determine-version.outputs.env }}
      hook_id_base: ${{ vars.REDEPLOYMENT_HOOK_ID_BASE }}
    secrets: inherit
