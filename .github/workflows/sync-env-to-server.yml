# Manually sync app env vars and secrets to the server scripts/.env for both TEST and PROD.
# Three jobs: build fragment per environment (matrix), then call shared workflow to transfer each.
name: Sync env to server

on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-fragment:
    name: Build env fragment (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: TEST
            sync_env: test
            artifact_name: sync-env-fragment-test
          - env: PROD
            sync_env: prod
            artifact_name: sync-env-fragment-prod
    environment: ${{ matrix.env }}
    steps:
      - name: Check required vars and secrets
        env:
          VPS_IP: ${{ vars.VPS_IP }}
          WEBHOOK_DIR: ${{ vars.WEBHOOK_DIR }}
          WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE: ${{ vars.WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE }}
          SYNC_ENV_REMOTE_FILENAME_PREFIX_BASE: ${{ vars.SYNC_ENV_REMOTE_FILENAME_PREFIX_BASE }}
          HTMT_API_APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
          SERVER_DEPLOY_USERNAME: ${{ secrets.SERVER_DEPLOY_USERNAME }}
          SERVER_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
          DB_APP_DB_NAME: ${{ secrets.DB_APP_DB_NAME }}
          DB_APP_USERNAME: ${{ secrets.DB_APP_USERNAME }}
          DB_APP_USER_PASSWORD: ${{ secrets.DB_APP_USER_PASSWORD }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          TMTA_USERNAME: ${{ secrets.TMTA_USERNAME }}
        run: |
          required=(
            VPS_IP WEBHOOK_DIR WEBHOOK_REDEPLOYMENT_DIR_NAME_BASE SYNC_ENV_REMOTE_FILENAME_PREFIX_BASE HTMT_API_APP_NAME
            DEMO_EMAIL SUPERADMIN_EMAIL
            SERVER_DEPLOY_USERNAME SERVER_DEPLOY_SSH_PRIVATE_KEY
            DB_APP_DB_NAME DB_APP_USERNAME DB_APP_USER_PASSWORD DB_SUPERUSER_PASSWORD
            DEMO_PASSWORD DEMO_USERNAME DJANGO_SECRET_KEY
            GOOGLE_CLIENT_SECRET SPOTIFY_CLIENT_SECRET
            SUPERADMIN_PASSWORD SUPERADMIN_USERNAME TMTA_USERNAME
          )
          missing=()
          for v in "${required[@]}"; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing required vars or secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required vars and secrets are set."

      - name: Build env fragment
        env:
          DB_APP_DB_NAME: ${{ secrets.DB_APP_DB_NAME }}
          DB_APP_USERNAME: ${{ secrets.DB_APP_USERNAME }}
          DB_APP_USER_PASSWORD: ${{ secrets.DB_APP_USER_PASSWORD }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          TMTA_USERNAME: ${{ secrets.TMTA_USERNAME }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
          FILE_UPLOAD_ENABLED: "true"
          AFP_ENABLED: "true"
          MUSICBRAINZ_LOOKUP_ENABLED: "true"
          SPOTIFY_ENABLED: "true"
          GOOGLE_OAUTH_ENABLED: "true"
        run: |
          mkdir -p ${{ matrix.artifact_name }}
          FRAGMENT="${{ matrix.artifact_name }}/fragment.env"
          for key in DB_APP_DB_NAME DB_APP_USERNAME DB_APP_USER_PASSWORD DB_SUPERUSER_PASSWORD \
            DEMO_PASSWORD DEMO_USERNAME DJANGO_SECRET_KEY GOOGLE_CLIENT_SECRET SPOTIFY_CLIENT_SECRET \
            SUPERADMIN_PASSWORD SUPERADMIN_USERNAME TMTA_USERNAME DEMO_EMAIL SUPERADMIN_EMAIL \
            FILE_UPLOAD_ENABLED AFP_ENABLED MUSICBRAINZ_LOOKUP_ENABLED SPOTIFY_ENABLED GOOGLE_OAUTH_ENABLED; do
            val="${!key}"
            val=$(printf '%s' "$val" | tr -d '\n\r')
            [ -n "${val}" ] && printf '%s=%s\n' "$key" "$val" >> "$FRAGMENT"
          done

      - name: Upload fragment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}/

  sync-test:
    name: Transfer fragment to server (test)
    needs: build-fragment
    uses: BehindTheMusicTree/github-workflows/.github/workflows/sync-env-to-server.yml@main
    with:
      sync_env: test
      app_name: ${{ vars.HTMT_API_APP_NAME }}
      fragment_artifact: sync-env-fragment-test/fragment.env
    secrets: inherit

  sync-prod:
    name: Transfer fragment to server (prod)
    needs: build-fragment
    uses: BehindTheMusicTree/github-workflows/.github/workflows/sync-env-to-server.yml@main
    with:
      sync_env: prod
      app_name: ${{ vars.HTMT_API_APP_NAME }}
      fragment_artifact: sync-env-fragment-prod/fragment.env
    secrets: inherit
