# Sync app env to server via shared workflow (BehindTheMusicTree/github-workflows).
# Two fragments per env (same contract as the-music-deck-admin): API basename + Postgres service basename
# (HTMT_API_APP_NAME + DB_APP_NAME_SUFFIX; variable required, no default). Promotes to /tmp/sync-env-<app>-<env>.env then canonical scripts/sync-env/.
name: Sync env to server

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-api-fragment:
    name: Build API env fragment (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: STAGING
            sync_env: staging
          - environment: PROD
            sync_env: prod
    environment: ${{ matrix.environment }}
    steps:
      - name: Validate vars and build API env fragment
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          REDEPLOYMENT_ROOT: ${{ vars.REDEPLOYMENT_ROOT }}
          HTMT_API_APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
          DB_APP_NAME_SUFFIX: ${{ vars.DB_APP_NAME_SUFFIX }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
          SPOTIFY_CLIENT_ID_STAGING: ${{ vars.SPOTIFY_CLIENT_ID_STAGING }}
          SPOTIFY_CLIENT_ID_PROD: ${{ vars.SPOTIFY_CLIENT_ID_PROD }}
          SPOTIFY_SCOPES: ${{ vars.SPOTIFY_SCOPES }}
          GOOGLE_CLIENT_ID_STAGING: ${{ vars.GOOGLE_CLIENT_ID_STAGING }}
          GOOGLE_CLIENT_ID_PROD: ${{ vars.GOOGLE_CLIENT_ID_PROD }}
          SERVER_DEPLOY_USERNAME: ${{ secrets.SERVER_DEPLOY_USERNAME }}
          SERVER_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
          DB_APP_DB_NAME: ${{ secrets.DB_APP_DB_NAME }}
          DB_APP_USERNAME: ${{ secrets.DB_APP_USERNAME }}
          DB_APP_USER_PASSWORD: ${{ secrets.DB_APP_USER_PASSWORD }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          DEMO_USERNAME: ${{ secrets.DEMO_USERNAME }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SUPERADMIN_PASSWORD: ${{ secrets.SUPERADMIN_PASSWORD }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          TMTA_USERNAME: ${{ secrets.TMTA_USERNAME }}
        run: |
          if [ "${{ matrix.environment }}" = "STAGING" ]; then
            export SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID_STAGING}"
            export GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID_STAGING}"
          else
            export SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID_PROD}"
            export GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID_PROD}"
          fi
          export SPOTIFY_SCOPES
          : > fragment.env
          printf '%s\n' \
            'FILE_UPLOAD_ENABLED=true' \
            'SPOTIFY_ENABLED=true' \
            'GOOGLE_OAUTH_ENABLED=true' \
            'MUSICBRAINZ_LOOKUP_ENABLED=true' \
            'HTMT_API_AFP_ENABLED=true' \
            'MEDIA_DIR=/app/media' \
            'LIBRARIES_DIR=/app/media/libraries/' \
            'TMP_UPLOADED_FILES=/tmp/uploads' >> fragment.env
          required=(
            SERVER_HOST REDEPLOYMENT_ROOT HTMT_API_APP_NAME DB_APP_NAME_SUFFIX
            DEMO_EMAIL SUPERADMIN_EMAIL SPOTIFY_CLIENT_ID SPOTIFY_SCOPES GOOGLE_CLIENT_ID
            SERVER_DEPLOY_USERNAME SERVER_DEPLOY_SSH_PRIVATE_KEY
            DB_APP_DB_NAME DB_APP_USERNAME DB_APP_USER_PASSWORD DB_SUPERUSER_PASSWORD
            DEMO_PASSWORD DEMO_USERNAME DJANGO_SECRET_KEY ACOUSTID_API_KEY
            GOOGLE_CLIENT_SECRET SPOTIFY_CLIENT_SECRET
            SUPERADMIN_PASSWORD SUPERADMIN_USERNAME TMTA_USERNAME
          )
          missing=()
          for v in "${required[@]}"; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing required vars or secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required vars and secrets are set."
          for key in DB_APP_DB_NAME DB_APP_USERNAME DB_APP_USER_PASSWORD DB_SUPERUSER_PASSWORD \
            DEMO_PASSWORD DEMO_USERNAME DJANGO_SECRET_KEY ACOUSTID_API_KEY GOOGLE_CLIENT_SECRET SPOTIFY_CLIENT_SECRET \
            SUPERADMIN_PASSWORD SUPERADMIN_USERNAME TMTA_USERNAME DEMO_EMAIL SUPERADMIN_EMAIL \
            SPOTIFY_CLIENT_ID SPOTIFY_SCOPES GOOGLE_CLIENT_ID; do
            val="${!key}"
            val=$(printf '%s' "$val" | tr -d '\n\r')
            [ -n "${val}" ] && printf '%s=%s\n' "$key" "$val" >> fragment.env
          done

      - name: Upload API fragment artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: sync-env-fragment-api-${{ matrix.sync_env }}
          path: fragment.env

  build-db-fragment:
    name: Build Postgres env fragment (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - environment: STAGING
            sync_env: staging
          - environment: PROD
            sync_env: prod
    environment: ${{ matrix.environment }}
    steps:
      - name: Validate vars and build DB env fragment
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          REDEPLOYMENT_ROOT: ${{ vars.REDEPLOYMENT_ROOT }}
          HTMT_API_APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
          DB_APP_NAME_SUFFIX: ${{ vars.DB_APP_NAME_SUFFIX }}
          DB_APP_DB_NAME: ${{ secrets.DB_APP_DB_NAME }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          SERVER_DEPLOY_USERNAME: ${{ secrets.SERVER_DEPLOY_USERNAME }}
          SERVER_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SERVER_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          : > fragment.env
          if [ -z "${DB_APP_NAME_SUFFIX:-}" ]; then
            echo "ERROR: GitHub Variable DB_APP_NAME_SUFFIX must be set and non-empty (same value as infrastructure repo)."
            exit 1
          fi
          suffix="${DB_APP_NAME_SUFFIX}"
          db_basename="${HTMT_API_APP_NAME}${suffix}"
          printf '%s\n' "POSTGRES_USER=postgres" >> fragment.env
          val="$(printf '%s' "${DB_APP_DB_NAME}" | tr -d '\n\r')"
          printf 'POSTGRES_DB=%s\n' "${val}" >> fragment.env
          val="$(printf '%s' "${DB_SUPERUSER_PASSWORD}" | tr -d '\n\r')"
          printf 'POSTGRES_PASSWORD=%s\n' "${val}" >> fragment.env
          printf '%s\n' "POSTGRES_PORT=5432" >> fragment.env
          required=(
            SERVER_HOST REDEPLOYMENT_ROOT HTMT_API_APP_NAME DB_APP_NAME_SUFFIX
            SERVER_DEPLOY_USERNAME SERVER_DEPLOY_SSH_PRIVATE_KEY
            DB_APP_DB_NAME DB_SUPERUSER_PASSWORD
          )
          missing=()
          for v in "${required[@]}"; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: Missing required vars or secrets: ${missing[*]}"
            exit 1
          fi
          echo "DB fragment ready for ${{ matrix.sync_env }} (sync basename ${db_basename})."

      - name: Upload DB fragment artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: sync-env-fragment-db-${{ matrix.sync_env }}
          path: fragment.env

  sync-api-staging:
    name: Sync API env (staging)
    needs: [build-api-fragment]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/sync-env-to-server.yml@main
    with:
      sync_env: staging
      fragment_artifact: sync-env-fragment-api-staging/fragment.env
      app_name: ${{ vars.HTMT_API_APP_NAME }}
    secrets: inherit

  sync-api-prod:
    name: Sync API env (prod)
    needs: [build-api-fragment]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/sync-env-to-server.yml@main
    with:
      sync_env: prod
      fragment_artifact: sync-env-fragment-api-prod/fragment.env
      app_name: ${{ vars.HTMT_API_APP_NAME }}
    secrets: inherit

  sync-db-staging:
    name: Sync Postgres env (staging)
    needs: [build-api-fragment, build-db-fragment]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/sync-env-to-server.yml@main
    with:
      sync_env: staging
      fragment_artifact: sync-env-fragment-db-staging/fragment.env
      app_name: ${{ format('{0}{1}', vars.HTMT_API_APP_NAME, vars.DB_APP_NAME_SUFFIX) }}
    secrets: inherit

  sync-db-prod:
    name: Sync Postgres env (prod)
    needs: [build-api-fragment, build-db-fragment]
    uses: BehindTheMusicTree/github-workflows/.github/workflows/sync-env-to-server.yml@main
    with:
      sync_env: prod
      fragment_artifact: sync-env-fragment-db-prod/fragment.env
      app_name: ${{ format('{0}{1}', vars.HTMT_API_APP_NAME, vars.DB_APP_NAME_SUFFIX) }}
    secrets: inherit
