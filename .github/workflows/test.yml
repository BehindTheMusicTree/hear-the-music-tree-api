name: Test

on:
  pull_request:
    branches: [main, develop]

env:
  CONTAINER_ROOT_DIR: /home/app/
  DB_CONNECTION_TEST_MAX_ATTEMPTS: 10
  DB_CONNECTION_TEST_SLEEP_INTERVAL: 5
  ENV: test

  APP_VERSION: 'test'
  TMP_UPLOADED_FILES_EXTERNAL: /tmp/ci-uploaded/
  MEDIA_DIR_INTERNAL: media/
  LIBRARIES_DIR_NAME: libraries

  DB_IS_NEEDED: true
  DB_URL: localhost
  DB_DATA_DIR: /var/lib/postgresql/data
  DB_SUPERUSER_NAME: postgres
  DB_PORT: '5432'

  AFP_URL: localhost
  AFP_PORT: '3002'
  AFP_POOL_DIR_EXTERNAL: /tmp/ci-afp-pool/
  AFP_POST_ENDPOINT: fingerprint-audio
  TMTA_USERNAME: tmta

  SUPERADMIN_USERNAME: ci_superadmin
  SUPERADMIN_PASSWORD: ci_superadmin_test
  SUPERADMIN_EMAIL: ci_superadmin@example.com
  DEMO_USERNAME: ci_demo
  DEMO_PASSWORD: ci_demo_test
  DEMO_EMAIL: ci_demo@example.com

jobs:
  check-vars-and-secrets:
    name: Check vars and secrets
    runs-on: ubuntu-latest
    environment:
      name: CI_TEST
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required vars and secrets
        env:
          API_DIR_NAME: ${{ vars.API_DIR_NAME }}
          APP_TITLE: ${{ vars.APP_TITLE }}
          APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
          DB_VERSION: ${{ vars.DB_VERSION }}
          DB_CONTAINER_NAME: ${{ vars.DB_APP_NAME }}
          AFP_CONTAINER_NAME: ${{ vars.AFP_APP_NAME }}
          AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
          AFP_VERSION: ${{ vars.AFP_VERSION }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          DB_APP_DB_NAME: ${{ secrets.DB_APP_DB_NAME }}
          DB_APP_USERNAME: ${{ secrets.DB_APP_USERNAME }}
          DB_APP_USER_PASSWORD: ${{ secrets.DB_APP_USER_PASSWORD }}
        run: bash scripts/check-workflow-env.sh API_DIR_NAME APP_TITLE APP_NAME DOCKERHUB_USERNAME DB_IMAGE_REPO DB_VERSION DB_CONTAINER_NAME AFP_CONTAINER_NAME AFP_IMAGE_REPO AFP_VERSION DB_SUPERUSER_PASSWORD DB_APP_DB_NAME DB_APP_USERNAME DB_APP_USER_PASSWORD

  pytest:
    name: Pytest
    needs: [check-vars-and-secrets]
    runs-on: ubuntu-latest
    environment:
      name: CI_TEST
    env:
      ENV: CI_TEST
      API_DIR_NAME: ${{ vars.API_DIR_NAME }}
      APP_TITLE: ${{ vars.APP_TITLE }}
      APP_NAME: ${{ vars.HTMT_API_APP_NAME }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DB_IMAGE_REPO: ${{ vars.DB_IMAGE_REPO }}
      DB_VERSION: ${{ vars.DB_VERSION }}
      DB_CONTAINER_NAME: ${{ vars.DB_APP_NAME }}
      AFP_CONTAINER_NAME: ${{ vars.AFP_APP_NAME }}
      AFP_IMAGE_REPO: ${{ vars.AFP_IMAGE_REPO }}
      AFP_VERSION: ${{ vars.AFP_VERSION }}
      DEBUG: true
      DB_IS_NEEDED: true
      APP_IS_EXPOSED: false
      AFP_ENABLED: true
      SPOTIFY_ENABLED: false
      GOOGLE_OAUTH_ENABLED: false
      MUSICBRAINZ_LOOKUP_ENABLED: false
      DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
      DB_APP_DB_NAME: ${{ secrets.DB_APP_DB_NAME }}
      DB_APP_USERNAME: ${{ secrets.DB_APP_USERNAME }}
      DB_APP_USER_PASSWORD: ${{ secrets.DB_APP_USER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: ${{ runner.os }}-apt-${{ hashFiles('scripts/install-dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: sudo -E bash scripts/install-dependencies.sh

      - name: Add fpcalc to PATH
        run: echo "bin/fpcalc" >> $GITHUB_PATH

      - name: Install requirements
        run: PIP_NO_CACHE_DIR=off pip install -r requirements.txt

      - name: Set up filesystem
        run: bash scripts/setup-filesystem.sh

      - name: Run database and Audio Fingerprint containers
        env:
          DB_DATA_MUST_PERSIST: false
        run: bash scripts/run-db-and-afp-containers.sh

      - name: Wait for database service to start
        run: bash scripts/wait-for-postgres-db.sh ${{ env.DB_URL }} ${{ env.DB_PORT }} ${{ env.DB_CONNECTION_TEST_MAX_ATTEMPTS }} ${{ env.DB_CONNECTION_TEST_SLEEP_INTERVAL }}

      - name: Init django data
        run: bash scripts/init-django-data.sh

      - name: Run pytest
        run: |
          if [ -n "${{ inputs.test_path || '' }}" ]; then
            pytest -v --tb=short -x --junitxml=test-results.xml "${{ inputs.test_path }}"
          else
            pytest -v --tb=short -x --junitxml=test-results.xml ${{ env.API_DIR_NAME }}/test/
          fi

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml

