# Linters, type-checker, and dependency pins (audiometa-python-style PEP 621 project).
# Dev install: pip install -e ".[dev]". Production image / minimal env: pip install .

[build-system]
requires = ["setuptools==75.2.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hear-the-music-tree-api"
version = "2.2.3"
description = "Django REST API for Hear The Music Tree"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.8.1",
    "audiometa-python==1.1.0",
    "bcrypt==3.1.7",
    "blinker==1.4",
    "certifi==2019.11.28",
    "chardet==3.0.4",
    "Click==7.0",
    "colorama==0.4.3",
    "Django==5.2.8",
    "django-cors-headers==4.3.1",
    "django-database-view==0.3.0",
    "django-extensions==3.2.1",
    "django-filter==25.2",
    "django-model-utils==5.0.0",
    "django-polymorphic==4.1.0",
    "django-rest-multiple-models==2.1.3",
    "djangorestframework-camel-case==1.4.2",
    "djangorestframework-recursive==0.1.2",
    "djangorestframework-simplejwt==5.3.1",
    "djangorestframework==3.15.1",
    "distro==1.4.0",
    "docker==7.1.0",
    "drf-spectacular==0.29.0",
    "fake-samples-loader==1.0.13",
    "gunicorn==20.1.0",
    "httplib2==0.22.0",
    "Markdown==3.4.1",
    "oauthlib==3.1.0",
    "pathlib==1.0.1",
    "psycopg2-binary==2.9.11",
    "pyacoustid==1.3.0",
    "pydub==0.25.1",
    "pyOpenSSL==22.1.0",
    "PyJWT==2.5.0",
    "python-dateutil==2.7.3",
    "python-dotenv==1.0.1",
    "python-magic==0.4.27",
    "requests==2.32.3",
    "shortuuid==1.0.9",
    "simplejson==3.16.0",
    "spotipy==2.23.0",
    "tinytag==1.10.1",
    "uvicorn==0.20.0",
    "werkzeug==2.2.2",
]

[project.optional-dependencies]
dev = [
    "bump2version==1.0.1",
    "coverage==6.5.0",
    "django-dynamic-fixture==4.0.1",
    "django-stubs==5.2.1",
    "djangorestframework-stubs==3.15.1",
    "isort==5.13.2",
    "mypy==1.18.2",
    "pre-commit==4.5.1",
    "pydocstringformatter==0.7.5",
    "pytest-django==4.8.0",
    "pytest-env==1.1.3",
    "pytest==8.1.1",
    "ruff==0.15.9",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120

[tool.pydocstringformatter]
max-line-length = 120

[tool.ruff]
# Shared rule set in baselines/ruff.toml (digest-checked by verify-standards).
extend = "baselines/ruff.toml"

[tool.ruff.lint.per-file-ignores]
# Deferred imports are used deliberately across Django models, serializers, and tests.
"api/**" = ["PLC0415"]
"api/test/**" = ["PLR2004"]
".pre-commit-hooks/**" = ["PLR2004"]
"scripts/prepare_release_bump.py" = ["TRY003", "EM101", "EM102", "PLR2004", "DTZ011", "RUF005", "T201", "I001"]
"scripts/fix_changelog_after_bump.py" = ["T201", "I001"]
"scripts/check_lint_baseline.py" = ["I001"]

# Same plugin layout as audiometa-style projects; strictness relaxed for gradual Django typing.
[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
warn_return_any = false
disable_error_code = [
    "abstract",
    "arg-type",
    "assignment",
    "attr-defined",
    "dict-item",
    "misc",
    "no-redef",
    "operator",
    "override",
    "return",
    "return-value",
    "type-abstract",
    "type-var",
    "union-attr",
    "valid-type",
    "var-annotated",
]

[tool.django-stubs]
django_settings_module = "api.settings"

[[tool.mypy.overrides]]
module = "api.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true
